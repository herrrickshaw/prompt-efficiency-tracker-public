[project]
name = "prompt-efficiency-tracker"
version = "1.0.0"
description = "Outcome/attribution tracking hooks for Claude Code usage plus promptfoo prompt-regression pilots"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.setuptools]
# scripts-only repo: nothing to package, but `pip install -e ".[dev]"` must not auto-discover hooks/launchd/promptfoo
py-modules = []

[tool.ruff]
target-version = "py39"
line-length = 120
extend-exclude = ["graphify-out", "promptfoo/market-pipeline/results-*.json"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
